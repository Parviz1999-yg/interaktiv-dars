name: Optimize project images

on:
  push:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert all project images to lossless WebP
        run: |
          for f in images/*.png images/*.jpg images/*.jpeg; do
            [ -f "$f" ] || continue
            case "$f" in
              *.png)  out="${f%.png}.webp" ;;
              *.jpg)  out="${f%.jpg}.webp" ;;
              *.jpeg) out="${f%.jpeg}.webp" ;;
            esac
            cwebp -quiet -lossless "$f" -o "$out"
          done

      - name: Commit WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.webp
          zip -j -q images/slides.zip images/*.png
          git add images/slides.zip
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Use lossless WebP for project images"
          git push
